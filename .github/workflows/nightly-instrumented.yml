name: Nightly & Instrumented Test Matrix

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
  pull_request:
    types: [ labeled, synchronize, opened, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  nightly-unit-stress:
    # Issue #86 Phase B: nightly-only full byte-cap stress (PR runs the slim
    # 11-turn versions; this job runs the original 100-turn / 200-row versions
    # with the true redact shaping). Independent 35-minute timeout + JUnit XML
    # (retained 14 days); red is triaged by filing an issue (manual, never
    # blocks merge — not in pr-check.yml pr-gate).
    if: github.event_name != 'pull_request'
    name: Nightly Unit Stress (byte-cap full)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Verify JDK 25 security floor (CVE-2026-91403)
        run: bash scripts/verify_jdk_floor.sh --require-vendor Temurin

      - name: Verify Gradle wrapper integrity
        run: python3 scripts/verify_gradle_wrapper.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run byte-cap full stress (Foss, NIGHTLY_STRESS=1)
        env:
          NIGHTLY_STRESS: "1"
        run: ./gradlew :app:testFossDebugUnitTest --tests "dev.librepocket.agent.ui.chat.ChatSnapshotByteCapFullStressTest" --stacktrace

      - name: Upload Stress Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-stress-reports-attempt-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  instrumented-test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-instrumented')
    name: Instrumented Tests (${{ matrix.flavor }}, API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
        flavor: [Play, Foss, Github]
        target: [google_apis]
        arch: [x86_64]
        include:
          - api-level: 36
            flavor: Foss
            target: google_apis
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Verify JDK 25 security floor (CVE-2026-91403)
        run: bash scripts/verify_jdk_floor.sh --require-vendor Temurin

      - name: Verify Gradle wrapper integrity
        run: python3 scripts/verify_gradle_wrapper.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: ./gradlew :app:connected${{ matrix.flavor }}DebugAndroidTest --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload Instrumentation Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-reports-${{ matrix.flavor }}-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
