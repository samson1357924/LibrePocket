name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests (all flavors)
        run: ./gradlew test --console=plain

      - name: Assemble both flavors
        run: ./gradlew assemblePlayDebug assembleFullDebug --console=plain

      - name: Play policy gate (D07)
        run: |
          APK=$(ls app/build/outputs/apk/play/debug/*.apk | head -n 1)
          echo "checking $APK"
          sh scripts/play_policy_check.sh "$APK"
