name: Release & Distribution

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PRESENT: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble Release Artifacts (APKs & AABs)
        run: |
          ./gradlew :app:assemblePlayRelease \
                    :app:assembleFossRelease \
                    :app:assembleGithubRelease \
                    :app:bundlePlayRelease \
                    :app:bundleGithubRelease

      - name: Configure Android SDK build-tools for aapt & dexdump
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BT_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$BT_DIR" ] && [ -d "$BT_DIR" ]; then
              echo "$BT_DIR" >> "$GITHUB_PATH"
            fi
          fi

      - name: Verify Play Release Policy Gate (ROADMAP D07)
        run: |
          chmod +x scripts/play_policy_check.sh
          # 動態查找 play release 的 apk 檔名（相容 signed 或 unsigned）
          PLAY_APK_TARGET=$(find app/build/outputs/apk/play/release -maxdepth 1 -name "*.apk" | head -n 1)
          scripts/play_policy_check.sh \
            app/build/outputs/bundle/playRelease/app-play-release.aab \
            "$PLAY_APK_TARGET"

      - name: Verify Foss Release Policy Gate (ROADMAP D07)
        run: |
          chmod +x scripts/play_policy_check.sh
          # 動態查找 foss release 的 apk 檔名（相容 signed 或 unsigned）
          FOSS_APK_TARGET=$(find app/build/outputs/apk/foss/release -maxdepth 1 -name "*.apk" | head -n 1)
          scripts/play_policy_check.sh --foss "$FOSS_APK_TARGET"

      - name: Sign Android Artifacts (if secret configured)
        if: env.KEYSTORE_PRESENT == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Generate SBOM for GitHub APK (CycloneDX, pinned)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: app/build/outputs/apk/github/release/
          format: cyclonedx-json
          output-file: sbom-github.cyclonedx.json

      - name: Prepare Release Artifacts with Checksums
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${{ github.ref_name }}"
          [ -z "$VERSION_TAG" ] && VERSION_TAG="snapshot"

          # 只發布已簽名 GitHub APK，次選 unsigned（Play AAB/APK 僅作政策自證、
          # Foss unsigned 僅作政策校驗，均不進 release-artifacts）
          GITHUB_APK=$(find app/build/outputs/apk/github/release -name "*signed.apk" | head -n 1)
          [ -z "$GITHUB_APK" ] && GITHUB_APK=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          [ -n "$GITHUB_APK" ] && cp "$GITHUB_APK" "release-artifacts/LibrePocket-${VERSION_TAG}-github.apk"

          # SBOM（GitHub APK 專屬）
          [ -f sbom-github.cyclonedx.json ] && cp sbom-github.cyclonedx.json "release-artifacts/SBOM-github.cyclonedx.json"

          # 產生 SHA256 校驗碼清單
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Attest Play & Foss Artifacts (built & gated, not published)
        run: |
          ls -lh app/build/outputs/apk/play/release/ \
                 app/build/outputs/bundle/playRelease/ \
                 app/build/outputs/apk/foss/release/ \
                 app/build/outputs/bundle/githubRelease/

      - name: Archive Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-binaries
          path: release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
