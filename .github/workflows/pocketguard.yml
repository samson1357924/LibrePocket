name: PocketGuard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: pocketguard-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-tag:
    name: Prepare and deterministic tagging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labels: ${{ steps.tag.outputs.labels }}
      target: ${{ steps.tag.outputs.target }}
      command: ${{ steps.tag.outputs.command }}
      needs_diff: ${{ steps.tag.outputs.needs_diff }}
      safe_review: ${{ steps.tag.outputs.safe_review }}
      authorized: ${{ steps.tag.outputs.authorized }}
      issue_number: ${{ steps.tag.outputs.issue_number }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked dependencies
        working-directory: github_bot
        run: npm ci --ignore-scripts

      - name: Emit deterministic labels and routing context
        id: tag
        working-directory: github_bot
        # This job holds no secrets; GITHUB_TOKEN only allows the read-only
        # authorization gate (permission check + pulls.get) on issue_comment.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/ts-node src/github_runner.ts --mode=tag

  review-send:
    name: Review with isolated CPA credentials
    needs: prepare-tag
    # Read-only gate first: unauthorized issue_comment never schedules this
    # secrets-bearing runner, so CPA secrets stay unreachable.
    if: >-
      needs.prepare-tag.outputs.target == 'pull-request' &&
      (github.event_name != 'issue_comment' || needs.prepare-tag.outputs.needs_diff == 'true') &&
      (github.event_name != 'issue_comment' || needs.prepare-tag.outputs.authorized == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked dependencies
        working-directory: github_bot
        run: npm ci --ignore-scripts

      - name: Resolve trusted pull-request origin
        id: gate
        working-directory: github_bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/ts-node src/github_runner.ts --mode=tag

      - name: Run trusted single-turn review
        if: steps.gate.outputs.safe_review == 'true' && steps.gate.outputs.authorized == 'true'
        working-directory: github_bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POCKETGUARD_SAFE_REVIEW: 'true'
          POCKETGUARD_OUTPUT: review-output.json
          CPA_BASE_URL: ${{ secrets.CPA_BASE_URL }}
          CPA_API_KEY: ${{ secrets.CPA_API_KEY }}
          POCKETGUARD_MODEL_CHIEF: ${{ vars.POCKETGUARD_MODEL_CHIEF }}
          POCKETGUARD_MODEL_ANDROID_SEC: ${{ vars.POCKETGUARD_MODEL_ANDROID_SEC }}
          POCKETGUARD_MODEL_ANDROID_CODE: ${{ vars.POCKETGUARD_MODEL_ANDROID_CODE }}
          POCKETGUARD_CPA_ORIGIN: ${{ vars.POCKETGUARD_CPA_ORIGIN }}
        run: ./node_modules/.bin/ts-node src/github_runner.ts --mode=review

      - name: Write generic result for untrusted pull request
        # Fail-closed complement of the trusted step: missing/empty/non-'true'
        # authorized lands here and runs the generic INCONCLUSIVE path only.
        if: steps.gate.outputs.safe_review != 'true' || steps.gate.outputs.authorized != 'true'
        working-directory: github_bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POCKETGUARD_SAFE_REVIEW: 'false'
          POCKETGUARD_OUTPUT: review-output.json
        run: ./node_modules/.bin/ts-node src/github_runner.ts --mode=review

      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketguard-review-output
          path: github_bot/review-output.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish review and labels
    needs: [prepare-tag, review-send]
    # Unauthorized issue_comment skips publish entirely: no artifact read, no
    # sticky write, no label changes, so an existing approval is never touched.
    if: >-
      always() && needs.prepare-tag.result == 'success' &&
      (github.event_name != 'issue_comment' || needs.prepare-tag.outputs.authorized == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked dependencies
        working-directory: github_bot
        run: npm ci --ignore-scripts

      - name: Download review result
        if: needs.review-send.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pocketguard-review-output
          path: github_bot

      - name: Publish sticky result and labels
        working-directory: github_bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POCKETGUARD_OUTPUT: review-output.json
          POCKETGUARD_REVIEW_JOB_RESULT: ${{ needs.review-send.result }}
          POCKETGUARD_TAG_LABELS: ${{ needs.prepare-tag.outputs.labels }}
        run: ./node_modules/.bin/ts-node src/github_runner.ts --mode=publish
