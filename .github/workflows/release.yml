name: Release & Distribution (disabled)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-disabled:
    name: Fail closed until Issue #12 release gates are complete
    runs-on: ubuntu-latest
    steps:
      - name: Public release publishing is disabled
        shell: bash
        run: |
          echo "::error::Public release publishing is disabled while Issue #12 release gates remain open."
          exit 1
