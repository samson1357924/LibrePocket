name: PR Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      policy: ${{ steps.filter.outputs.policy }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        # Pinned to full commit SHA per supply-chain rule (see #20).
        # dorny/paths-filter v3 (v3 tag resolves to this SHA).
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            code:
              - 'app/src/**'
              - 'app/build.gradle.kts'
              - 'app/lint.xml'
              - 'gradle/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/pr-check.yml'
            policy:
              - 'scripts/play_policy_check.sh'
              - 'scripts/apk_policy_inspect.py'
              - 'scripts/summarize_junit.py'
              - 'scripts/check_test_budgets.py'
              - 'scripts/check_junit_durations.py'
              - 'scripts/tests/test_apk_policy_check.py'
              - 'scripts/tests/test_summarize_junit.py'
              - 'scripts/tests/test_check_test_budgets.py'
              - 'scripts/tests/test_check_junit_durations.py'
              - 'scripts/build_release.sh'
              - 'scripts/verify_release_apk.py'
              - 'scripts/release_artifact_stage.py'
              - 'scripts/check_release_pins.py'
              - 'scripts/check_release_tag_version.py'
              - 'scripts/fake_keystore_rehearsal.py'
              - 'scripts/release_signer_pins.example.json'
              - 'scripts/tests/test_release_artifact_verifier.py'
              - 'scripts/tests/test_build_release_identity.py'
              # The PR workflow itself: wiring changes must run the harness
              # tests that pin the workflow wiring (defense in depth; a
              # workflow edit already counts as code, so Gradle stages run).
              - '.github/workflows/pr-check.yml'
            bot:
              - 'github_bot/**'
              - '.github/workflows/pocketguard.yml'
              - '.github/workflows/pr-check.yml'

  unit-tests:
    name: Unit & Robolectric Tests (${{ matrix.flavor }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [play, foss, github]
    # 單風味實測約 7m（編譯 3.5m + 測試）；三 job 並跑，wall 取決於最慢分片。
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # NOTE: keep the three literal task names below — scripts/docs_claim_check.sh
      # greps them from this file and requires TESTING.md to document each one.
      # Issue #86 Phase C guardrails (gates, fail-closed; only reject/alert,
      # never silently downgrade redaction): write-budget lint runs BEFORE the
      # suite (static, no Gradle), duration gate runs AFTER (needs JUnit XML).
      - name: Check test write budgets (Issue #86, gate)
        run: python3 scripts/check_test_budgets.py

      - name: Run Unit Tests (${{ matrix.flavor }} flavor)
        run: |
          case "${{ matrix.flavor }}" in
            play) ./gradlew :app:testPlayDebugUnitTest --stacktrace ;;
            foss) ./gradlew :app:testFossDebugUnitTest --stacktrace ;;
            github) ./gradlew :app:testGithubDebugUnitTest --stacktrace ;;
            *) echo "unknown flavor: ${{ matrix.flavor }}"; exit 1 ;;
          esac

      - name: Check JUnit durations (Issue #86, gate)
        # Gate (unlike the reporting-only summary below): any single test class
        # over 120s fails the job. No XML (suite never ran) skips green — the
        # Gradle step above already governs that case.
        run: python3 scripts/check_junit_durations.py

      # 報告（非 gate）：flaky 取證要在 run 頁面直接可見——不必下載 artifact、
      # 不必翻 job log。這一步只讀 JUnit XML（app/build/test-results/**/TEST-*.xml），
      # 把 tests/failures/errors/skipped 總數、失敗的「類別.方法」（含 assertion
      # 摘要第一行）與 skipped 清單寫進 $GITHUB_STEP_SUMMARY。真正的 gate 是
      # pr-gate job，所以本 step 任何情況都 exit 0（no XML → NO_RESULTS 說明略過；
      # 解析異常 → 記訊息後照常結束），絕不因報告失敗變紅。狀態行只在
      # unreadable==0、tests>0、failures==0、errors==0 且明細一致時宣告
      # PASS；其餘為 FAIL/PARTIAL/INCOMPLETE/NO_RESULTS。輸出以 UTF-8 bytes
      # 計維持在 900 KiB 預算內，超額截斷並註記 omitted 數量。
      # 解析實作在 scripts/summarize_junit.py（純函式，可被單測匯入），此處只保留
      # 薄呼叫層與原有 fallback（summary_parser_crashed_fallback）。
      - name: Summarize Unit Test Results (${{ matrix.flavor }})
        # always()：測試失敗時後續 step 預設會被跳過，而失敗恰恰是 needs
        # summary 的時刻，所以必須無條件執行。
        if: always()
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          # parser 自己崩潰（語法錯誤、BaseException、python3 不存在）時 run 頁面
          # 不可完全空白：fallback 必須同時具備
          #   1) [ -n "${GITHUB_STEP_SUMMARY:-}" ] guard——變數為空時 >> "" 在
          #      bash -e 下會讓 step 變紅，等於新增 exit 非 0 路徑；
          #   2) printf 自身 || true、function 呼叫再 || true——fallback 失敗
          #      也不得弄紅本 step（報告功能壞掉不是 gate 失敗）。
          summary_parser_crashed_fallback() {
            echo "WARN: summary parser crashed (ignored; reporting only, not a gate)"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' \
                "### Unit test summary — ${FLAVOR:-?} flavor" \
                "" \
                "> **Summary parser crashed** before it could write a unit-test summary — see this job's log for the parser error (reporting only; the real gate is pr-gate)." \
                "" >>"${GITHUB_STEP_SUMMARY}" || true
            fi
          }

          python3 scripts/summarize_junit.py || summary_parser_crashed_fallback || true
          echo "unit-test summary done (report only — real gate is pr-gate)"

      - name: Upload Test Reports
        # always()：綠燈 run 也要留存，才能做「同一測試方法跨 run 失敗率」統計
        # 與 re-run 的 attempt 1 vs 2 比對（flaky 取證）；cancelled（超時被砍）
        # 同理，盡力上傳（best-effort）——超時或取消時 runner 可能在 step 完成前被殺，
        # always() 保證被排入執行，不保證一定完成。
        # JUnit XML（app/build/test-results/）是逐測試方法的結構化資料，必須與
        # HTML 報告一起留存——只留 HTML 無法跨 run 比對。
        if: always()
        # 避免 GitHub Actions artifact 後端暫時性抖動（如 502/短暫中斷）把「測試全綠」
        # 的 job 打成 failure 誤判為紅燈。上傳報告是取證輔助，不應成為新的 flake 來源。
        # 真正的 gate 是 pr-gate job（評估 unit-tests 的執行結果，不依賴 artifact）。
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # run_attempt 後綴：同一 run re-run 時不會撞到 v4 的 artifact 重名錯誤。
          name: unit-test-reports-${{ matrix.flavor }}-attempt-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          # 不設定 if-no-files-found：預設值 warn 只會在檔案不存在（路徑漂移）時
          # 印一條 warning，不會 fail action——只有 error 才會失敗。這裡刻意保留
          # 預設 warn 的診斷訊號：若設 ignore 等於靜默壓制「報告沒上傳」的警告。
          # setup 階段失敗的紅燈由 pr-gate 決定，warn 不會額外多開一盞紅燈。

  lint:
    name: Android Lint Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android Lint (Play, Foss & GitHub Flavors)
        run: ./gradlew :app:lintPlayDebug :app:lintFossDebug :app:lintGithubDebug

      - name: Upload Lint Reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          retention-days: 7

  policy-harness:
    name: Python Policy Harness
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run APK policy and release-identity harnesses (stdlib only)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_apk_policy_check.py scripts/tests/test_release_artifact_verifier.py scripts/tests/test_build_release_identity.py scripts/tests/test_summarize_junit.py scripts/tests/test_check_test_budgets.py scripts/tests/test_check_junit_durations.py

      # PR #87 P2-4: script-only diffs (code == false) skip the unit-tests job
      # that hosts the write-budget gate, so the repo-wide scan runs here too —
      # the harness tests alone only cover the scripts' own logic, never the
      # current tree.
      - name: Run test-budget repo guard (Issue #86, gate)
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_test_budgets.py

  build-and-policy-gate:
    name: Build & Policy Gates
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble Debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleFossDebug :app:assembleGithubDebug

      - name: Configure Android SDK build-tools for aapt & dexdump
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BT_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$BT_DIR" ] && [ -d "$BT_DIR" ]; then
              echo "$BT_DIR" >> "$GITHUB_PATH"
            fi
          fi

      - name: Run Play Policy Check (ROADMAP D07)
        run: |
          chmod +x scripts/play_policy_check.sh
          scripts/play_policy_check.sh app/build/outputs/apk/play/debug/app-play-debug.apk

      - name: Run Foss Policy Check (ROADMAP D07)
        run: |
          chmod +x scripts/play_policy_check.sh
          scripts/play_policy_check.sh --foss app/build/outputs/apk/foss/debug/app-foss-debug.apk

      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

  # The docs gate fails closed (a violation turns this job red). `main`
  # requires the `PR Gate` status check, and `pr-gate` fails when
  # `docs-guard` is not success, so a red docs gate blocks merge.
  # `enforce_admins` is off; no repository rulesets and no CODEOWNERS.
  docs-guard:
    name: Docs Claim Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pin the docs-guard dependency instead of relying on the runner image:
      # PyYAML is a hard dependency of the docs claim check (A0 parses every
      # checked-in workflow). The requirement + all accepted artifact hashes
      # live in scripts/requirements-docs.txt (cp310-cp314 manylinux x86_64
      # wheels + sdist); `pip install --hash` is not a CLI option, so the pin
      # must be consumed as a requirements file. --ignore-installed forces
      # downloading the hashed artifact even when the runner already has
      # PyYAML 6.0.3 (otherwise no hash is checked); the exact version
      # assertion below remains fail-closed.
      - name: Install pinned PyYAML
        env:
          # Ubuntu 24.04 marks the system Python as externally managed; --user
          # installs remain user-scoped while allowing pip to proceed.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check --ignore-installed --require-hashes -r scripts/requirements-docs.txt
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3", yaml.__version__'

      # Fixture self-test first (D-02): proves the guard still rejects each
      # enumerated zero-wiring bypass surface — manifest registration parsed as
      # XML (component element/attribute, relative basename incl. backticked
      # Kotlin type names, entity-encoded FQN, package attribute/placeholder),
      # gradle injection (any standalone MCP literal in a scanned gradle file;
      # manifestPlaceholders incl. add/set/get and case-insensitive spelling,
      # any srcFile/setSrcFile token incl. alias/.apply{} forms — AGP's real
      # API is manifest.srcFile(...), namespace/applicationId +
      # setNamespace/setApplicationId, incl. triple-quoted/slashy strings,
      # Property .set/.convention/.value, comments/space normalisation, and a
      # cross-line value after `=`; decoded Unicode escapes, gradle.properties
      # literals and `\` continuations), package-based split (recursive Kotlin
      # string-template lexer incl. Java text-block escapes, Java JLS Unicode
      # escape decoding + ESC pre-scan that masks only the package header,
      # comments/strings stripped, >1 declaration fails closed, subpackages
      # and comment/whitespace/backtick-split declarations in-package),
      # out-of-package references / new modules (string-aware comment
      # stripping, backtick/space-normalised FQN), in-package imports
      # (comment/semicolon-normalised allowlist) and FQNs, and each discovery
      # fail-closed path (no manifests / no src roots / unreadable or zero
      # production sources) — before trusting its PASSED on this repo.
      - name: Run docs claim check self-test
        run: |
          chmod +x scripts/test_docs_claim_check.sh
          scripts/test_docs_claim_check.sh

      - name: Run docs claim check
        run: |
          chmod +x scripts/docs_claim_check.sh
          scripts/docs_claim_check.sh

  bot-tests:
    name: PocketGuard Bot Tests
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install locked dependencies
        working-directory: github_bot
        run: npm ci --ignore-scripts

      - name: Run bot tests
        working-directory: github_bot
        run: npm test

      - name: Typecheck bot
        working-directory: github_bot
        run: npm run build

  # pr-gate aggregates the required jobs and fails when any did not succeed.
  # `main` requires the `PR Gate` status check, and `pr-gate` fails when
  # `docs-guard` is not success, so the docs gate is merge-blocking.
  # `enforce_admins` is off; no repository rulesets and no CODEOWNERS.
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, unit-tests, lint, build-and-policy-gate, policy-harness, docs-guard, bot-tests]
    if: always()
    steps:
      - name: Evaluate gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          POLICY: ${{ needs.changes.outputs.policy }}
          UNIT: ${{ needs.unit-tests.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build-and-policy-gate.result }}
          HARNESS: ${{ needs.policy-harness.result }}
          DOCS: ${{ needs.docs-guard.result }}
          BOT: ${{ needs.bot-tests.result }}
          BOT_PATHS: ${{ needs.changes.outputs.bot }}
        run: |
          fail=0

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "pr-gate: changes job did not succeed (result=$CHANGES_RESULT)"
            fail=1
          fi

          if [ "$DOCS" != "success" ]; then
            echo "pr-gate: docs-guard did not succeed (result=$DOCS)"
            fail=1
          fi

          case "$UNIT" in
            success)
              echo "pr-gate: unit-tests passed"
              ;;
            skipped)
              if [ "$CODE" = "false" ]; then
                echo "pr-gate: unit-tests skipped (no code changes) — pass"
              else
                echo "pr-gate: unit-tests skipped but code='$CODE' — fail"
                fail=1
              fi
              ;;
            *)
              echo "pr-gate: unit-tests result=$UNIT — fail"
              fail=1
              ;;
          esac

          case "$LINT" in
            success)
              echo "pr-gate: lint passed"
              ;;
            skipped)
              if [ "$CODE" = "false" ]; then
                echo "pr-gate: lint skipped (no code changes) — pass"
              else
                echo "pr-gate: lint skipped but code='$CODE' — fail"
                fail=1
              fi
              ;;
            *)
              echo "pr-gate: lint result=$LINT — fail"
              fail=1
              ;;
          esac

          case "$BUILD" in
            success)
              echo "pr-gate: build-and-policy-gate passed"
              ;;
            skipped)
              if [ "$CODE" = "false" ] && [ "$POLICY" = "false" ]; then
                echo "pr-gate: build-and-policy-gate skipped (no code/policy changes) — pass"
              else
                echo "pr-gate: build-and-policy-gate skipped but code='$CODE' policy='$POLICY' — fail"
                fail=1
              fi
              ;;
            *)
              echo "pr-gate: build-and-policy-gate result=$BUILD — fail"
              fail=1
              ;;
          esac

          case "$HARNESS" in
            success)
              echo "pr-gate: policy-harness passed"
              ;;
            skipped)
              if [ "$POLICY" = "false" ]; then
                echo "pr-gate: policy-harness skipped (no policy changes) — pass"
              else
                echo "pr-gate: policy-harness skipped but policy='$POLICY' — fail"
                fail=1
              fi
              ;;
            *)
              echo "pr-gate: policy-harness result=$HARNESS — fail"
              fail=1
              ;;
          esac

          case "$BOT" in
            success)
              echo "pr-gate: bot-tests passed"
              ;;
            skipped)
              if [ "$BOT_PATHS" = "false" ]; then
                echo "pr-gate: bot-tests skipped (no bot changes) — pass"
              else
                echo "pr-gate: bot-tests skipped but bot='$BOT_PATHS' — fail"
                fail=1
              fi
              ;;
            *)
              echo "pr-gate: bot-tests result=$BOT — fail"
              fail=1
              ;;
          esac

          if [ "$fail" -ne 0 ]; then
            echo "pr-gate: FAILED"
            exit 1
          fi
          echo "pr-gate: PASSED"
