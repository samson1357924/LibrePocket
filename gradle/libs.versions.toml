[versions]
# Build toolchain
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2025.09.00"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
coreSplashscreen = "1.0.1"
# compileSdk 37 / targetSdk 36 / minSdk 33 — see app/build.gradle.kts
compileSdk = "37"
targetSdk = "36"
minSdk = "33"
# Networking (streaming HTTP, e.g. SSE)
okhttpSse = "5.5.0"
# Local persistence
room = "2.8.5"
datastore = "1.2.1"
# Encrypted storage
securityCrypto = "1.1.0"
# Structured text codec (session JSONL export/import)
serializationJson = "1.10.0"
# P1 unit-test stack (M2/M4/M5 verification only; see docs/specs/P1_SPEC.md §10)
junit4 = "4.13.2"
robolectric = "4.17"
testCore = "1.7.0"
# SSE replay transport (JVM unit tests + instrumented no-external-network tests)
mockwebserver = "5.5.0"
# Instrumented UI assertions (androidTest only)
testExtJunit = "1.2.1"
espressoCore = "3.6.1"
# Long-term key vault (P2; P1 keeps stub only)
tink = "1.23.0"
# Phase1 flavors: OCR / scan / on-device inference (foss+github = OSS, github-only = ML Kit)
mlkitBarcodeScanning = "17.3.0"
mlkitTextRecognition = "16.0.1"
# S2 cloud voice fallback (github flavor only; foss/play must never reference it —
# see HardeningPolicy.FOSS_STRING_BLACKLIST + scripts/play_policy_check.sh foss gate).
azureSpeech = "1.52.0"
zxingCore = "3.5.4"
tessTwo = "9.1.0"
# S3 privileged bridge (github flavor only; foss/play must never reference it).
# Shizuku remote-process + provider (13.x line). Only `githubImplementation`
# may consume these (see app/build.gradle.kts); any `implementation(...)` leak
# into foss/play breaks store compliance.
shizuku = "13.1.5"
# NOTE: com.google.ai.edge.litert:litert (any 1.x/2.x) is unusable with AGP 9:
# litert + litert-api AARs both declare package="com.google.ai.edge.litert",
# tripping unique-namespace enforcement (verified 2.1.6/2.2.0). Phase1 pins the
# API-compatible org.tensorflow:tensorflow-lite instead (LiteRT lineage); revisit
# in Phase2 once Google fixes the upstream packaging.
tensorflowLite = "2.17.0"

[libraries]
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttpSse" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcodeScanning" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
azure-speech = { group = "com.microsoft.cognitiveservices.speech", name = "client-sdk", version.ref = "azureSpeech" }
# Compose UI (MainScreen + Theme + NavHost; Gemini/ChatGPT-style chat layout)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
tess-two = { group = "com.rmtheis", name = "tess-two", version.ref = "tessTwo" }
# S3 Shizuku bridge (github-only). Keys use hyphen form so the accessors read
# `libs.shizuku.api` / `libs.shizuku.provider`.
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
litert = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
