[versions]
# Build toolchain
agp = "9.4.1"
kotlin = "2.4.20"
# compileSdk 37 / targetSdk 36 / minSdk 33 — see app/build.gradle.kts
compileSdk = "37"
targetSdk = "36"
minSdk = "33"
# Networking (streaming HTTP, e.g. SSE)
okhttpSse = "5.5.0"
# Local persistence
room = "2.8.5"
datastore = "1.2.1"
# Encrypted storage
securityCrypto = "1.1.0"
# Structured text codec (session JSONL export/import)
serializationJson = "1.10.0"
# P1 unit-test stack (M2/M4/M5 verification only; see docs/specs/P1_SPEC.md §10)
junit4 = "4.13.2"
robolectric = "4.17"
testCore = "1.7.0"
# SSE replay transport (JVM unit tests + instrumented no-external-network tests)
mockwebserver = "5.5.0"
# Instrumented UI assertions (androidTest only)
testExtJunit = "1.2.1"
espressoCore = "3.6.1"
# Long-term key vault (P2; P1 keeps stub only)
tink = "1.23.0"

[libraries]
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttpSse" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
