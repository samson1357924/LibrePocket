# Gitleaks configuration for LibrePocket
title = "LibrePocket Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Allowlist test fixtures used for verifying sensitive data redaction and vault encryption"
condition = "AND"
paths = [
    '''(?:^|/)app/src/test/''',
    '''(?:^|/)app/src/androidTest/'''
]
regexes = [
    '''sk-abcDEF1234567890''',
    '''sk-testSECRET1234567890''',
    '''sk-abc123XYZ4567890''',
    '''sk-live-device-roundtrip-0123456789'''
]
