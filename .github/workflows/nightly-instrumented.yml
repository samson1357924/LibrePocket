name: Nightly & Instrumented Test Matrix

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  instrumented-test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-instrumented')
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
        target: [google_apis]
        arch: [x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedPlayDebugAndroidTest --no-daemon

      - name: Upload Instrumentation Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
